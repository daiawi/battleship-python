[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "battleship-python"
version = "1.0.0"
description = "A battleship game written in Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Daniel Williams" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
